<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Handicapped H2H</title>
  <style>
    body { font-family: sans-serif; max-width: 60rem; margin: 2rem auto; padding: 0 1rem; }
    nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
    nav a { margin-right: 1rem; }
    table { border-collapse: collapse; width: 100%; margin: 1rem 0; }
    th, td { border: 1px solid #ccc; padding: 0.4rem 0.6rem; text-align: left; }
    .row { margin-bottom: 0.5rem; }
    .warning { color: #b00; }
    .maths { background: #f5f5f5; padding: 1rem; border-radius: 4px; margin: 1rem 0; }
    .draw { color: #666; }
    fieldset.tiebreak { margin: 0.5rem 0 1rem; max-width: 40rem; }
    /* In a pass table, a thick double line between one match's rows and the next match's. */
    tbody.match + tbody.match td { border-top: 3px double #333; }
  </style>
</head>
<body>
  <nav>
    <div>
      <a href="{{ url_for('stage1') }}">Setup</a>
      <a href="{{ url_for('event_rotation') }}">Current pass</a>
      <a href="{{ url_for('event_results') }}">Results</a>
      <a href="{{ url_for('archer_results') }}">Archer results</a>
      <a href="{{ url_for('handicap_calculator') }}">Handicap calculator</a>
      <a href="{{ url_for('reset') }}">Reset</a>
    </div>
  </nav>
  {% block content %}{% endblock %}
</body>
</html>
